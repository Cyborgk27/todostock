<div class="drawer lg:drawer-open min-h-screen bg-base-200 text-base-content">
  <input id="dashboard-sidebar" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex flex-col">
    
    <header class="navbar bg-base-100 shadow-sm border-b border-base-300 px-4 sticky top-0 z-50">
      <div class="flex-none lg:hidden">
        <label for="dashboard-sidebar" aria-label="open sidebar" class="btn btn-square btn-ghost">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-6 w-6 stroke-current">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </label>
      </div>
      
      <div class="flex-1 px-2 mx-2 font-bold text-lg text-primary">
        TodoStock Panel
      </div>
      
      <div class="flex-none gap-4">
        <div class="flex flex-col items-end hidden sm:flex">
          <span class="text-sm font-semibold">{{ authFacade.userName() }}</span>
          <span class="text-xs text-base-content/60">{{ authFacade.userEmail() }}</span>
        </div>
        
        <div class="dropdown dropdown-end">
          <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar bg-primary text-primary-content placeholder font-bold">
            <span>{{ authFacade.userName().charAt(0) || 'U' }}</span>
          </div>
          <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-52 p-2 shadow border border-base-300">
            <li><a>Mi Perfil</a></li>
            <li><a>Configuración</a></li>
            <div class="divider my-1"></div>
            <li>
              <button (click)="onLogoutClick()" class="text-error font-medium hover:bg-error/10">
                Cerrar Sesión
              </button>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <main class="flex-1 p-6 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
    
  </div>

  <div class="drawer-side z-50">
    <label for="dashboard-sidebar" aria-label="close sidebar" class="drawer-overlay"></label>
    
    <aside class="bg-base-100 border-r border-base-300 w-64 min-h-screen flex flex-col justify-between">
      <div>
        <div class="p-6 border-b border-base-300 flex items-center gap-3">
          <div class="bg-primary text-primary-content p-2 rounded-lg font-black text-xl tracking-wider shadow">
            TS
          </div>
          <div>
            <h1 class="font-black text-lg tracking-tight leading-none">TodoStock</h1>
            <span class="text-xs text-base-content/50">Gestión de Inventario</span>
          </div>
        </div>
        
        <ul class="menu menu-md p-4 gap-1">
          
          <li class="menu-title text-xs font-bold tracking-wider text-base-content/40 uppercase mt-2">General</li>
          <li>
            <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="font-medium gap-3">
              <i class="pi pi-home text-lg"></i>
              Inicio
            </a>
          </li>

          <li class="menu-title text-xs font-bold tracking-wider text-base-content/40 uppercase mt-4">Módulos del Sistema</li>
          
          <li>
            <a routerLink="/dashboard/products" routerLinkActive="active" class="font-medium gap-3">
              <i class="pi pi-box text-lg"></i>
              Productos
            </a>
          </li>
          
          <li>
            <a routerLink="/dashboard/invoices" routerLinkActive="active" class="font-medium gap-3">
              <i class="pi pi-receipt text-lg"></i>
              Facturación
            </a>
          </li>

          </ul>
      </div>

      <div class="p-4 border-t border-base-300 text-center text-xs text-base-content/40 font-mono">
        v1.0.0 &copy; 2026
      </div>
    </aside>
  </div>
</div>
