<div class="flex flex-col sm:flex-row justify-between items-center gap-4 w-full bg-base-100 p-4 rounded-xl border border-base-300 shadow-sm mt-4">
  <span class="text-xs text-base-content/60 font-medium">
    Página {{ currentPage() }} de {{ lastPage() }}
  </span>

  <div class="join shadow-sm border border-base-300">
    <button 
      class="join-item btn btn-sm bg-base-200/50 hover:bg-base-300 text-base-content border-none"
      [disabled]="isFirstPage()"
      (click)="changePage(currentPage() - 1)">
      «
    </button>

    @for (page of pagesArray(); track page) {
      <button 
        class="join-item btn btn-sm border-none transition-colors"
        [class.btn-primary]="page === currentPage()"
        [class.text-white]="page === currentPage()"
        [class.bg-base-100]="page !== currentPage()"
        [class.text-base-content]="page !== currentPage()"
        [class.hover:bg-base-200]="page !== currentPage()"
        (click)="changePage(page)">
        {{ page }}
      </button>
    }

    <button 
      class="join-item btn btn-sm bg-base-200/50 hover:bg-base-300 text-base-content border-none"
      [disabled]="isLastPage()"
      (click)="changePage(currentPage() + 1)">
      »
    </button>
  </div>
</div>
